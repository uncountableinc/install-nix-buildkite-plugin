name: Install Nix
description: Installs nix on buildkite
author: https://github.com/uncountableinc
requirements: []
configuration:
  properties:
    extra-substituters:
      type: array
      items:
        type: string
    extra-trusted-public-keys:
      type: array
      items:
        type: string
    extra-conf:
      type: array
      items:
        type: string
    packages:
      type: array
      items:
        type: object
        properties:
          source:
            type: string
          attrs:
            type: array
            items:
              type: string
        required:
          - source
          - attrs
        additionalProperties: false
    start-daemon:
      type: boolean
  additionalProperties: false
